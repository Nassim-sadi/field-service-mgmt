services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldservice}
      POSTGRES_USER: ${DB_USER:-fieldservice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldservice_dev_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-fieldservice}
      DB_USER: ${DB_USER:-fieldservice}
      DB_PASSWORD: ${DB_PASSWORD:-fieldservice_dev_pass}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-change-me}
      DEBUG: ${DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-* }
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://127.0.0.1:4200}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
